spring.application.name=Facturation

#Connection à la BD
spring.datasource.url=jdbc:mysql://localhost:3306/facturation_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

#Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

#Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

server.port=8082
server.servlet.context-path=/facturation